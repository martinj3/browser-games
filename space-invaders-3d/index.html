<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Orbital Invaders</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%236ad1ff' stroke-width='1'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./js/vendor/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <div id="viewport">
      <canvas id="game-canvas"></canvas>

      <div id="hud">
        <div id="hud-top">
          <div id="hud-score">SCORE <span id="score-value">0</span></div>
          <div id="hud-wave">WAVE <span id="wave-value">1</span></div>
          <div id="hud-lives"></div>
        </div>
      </div>

      <div id="overlay" class="hidden">
        <div id="overlay-title"></div>
        <div id="overlay-subtitle"></div>
        <button id="overlay-button" class="hidden">Restart</button>
      </div>
    </div>

    <div id="controls">
      <button id="fire-left" class="fire-button" aria-label="Fire">FIRE</button>
      <div id="trackpad-wrap">
        <div id="trackpad">
          <div id="trackpad-nub"></div>
        </div>
      </div>
      <button id="fire-right" class="fire-button" aria-label="Fire">FIRE</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
